name: Build the Dev Image

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install AWS cli
      uses: unfor19/install-aws-cli-action@master

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Authorize AWS to Docker Push
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 280501305789.dkr.ecr.us-east-1.amazonaws.com

    - name: Create tag name
      run: echo "tag=$(date +'%Y-%m-%dT%H-%M-%S')_$GITHUB_SHA" >> $GITHUB_ENV

    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        context: .
        file: 'Dockerfile'
        push: true
        tags: |
            280501305789.dkr.ecr.us-east-1.amazonaws.com/popeye:v0.11.1